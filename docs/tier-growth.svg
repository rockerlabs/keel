<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="Animated figure: as sessions progress from 1 to 10 to 30, the on-demand files — FRAMEWORK.md, BACKLOG.md, LEARNINGS.md — grow taller, with BACKLOG.md briefly shrinking when tickets close. The always-on core files, the global CLAUDE.md and the project's CLAUDE.md, stay the same thin height throughout. A gauge showing tokens loaded at session start stays flat at about 2K across all three moments — the per-session cost never grows even as total knowledge does.">
  <style>
    :root{
      --bg:#ffffff; --card:#f6f8fa; --ink:#1f2328; --muted:#59636e; --line:#d0d7de;
      --good:#1a7f37; --goodbg:#dafbe1; --accent:#0969da; --flatbar:#9aa4af;
    }
    @media (prefers-color-scheme: dark){
      :root{
        --bg:#0d1117; --card:#161b22; --ink:#e6edf3; --muted:#9198a1; --line:#30363d;
        --good:#3fb950; --goodbg:#0f2417; --accent:#4493f8; --flatbar:#4d5762;
      }
    }
    .ink{fill:var(--ink)} .muted{fill:var(--muted)}
    .h{font-size:15px;font-weight:700}
    .t{font-size:13px} .s{font-size:12px}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px}
    .lbl{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
    .tiny{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:9px}
    #od1,#od2,#od3{animation:odCycle 12s ease-in-out infinite}
    #od2{animation-delay:-8s}
    #od3{animation-delay:-4s}
    @keyframes odCycle{0%{opacity:1}29%{opacity:1}33%{opacity:0}96%{opacity:0}100%{opacity:1}}
    @media (prefers-reduced-motion: reduce){
      /* no animation: show the grown, final frame — session 30 — not mid-loop */
      #od1{animation:none;opacity:0} #od2{animation:none;opacity:0} #od3{animation:none;opacity:1}
    }
  </style>

  <rect x="0" y="0" width="720" height="460" rx="14" fill="var(--bg)"/>
  <rect x="0.5" y="0.5" width="719" height="459" rx="14" fill="none" stroke="var(--line)"/>

  <text x="32" y="42" class="h ink">Knowledge grows, per-session cost stays flat</text>

  <!-- gauge: loaded at session start — identical at every moment -->
  <rect x="32" y="60" width="656" height="64" rx="14" fill="var(--goodbg)" stroke="var(--good)"/>
  <text x="48" y="82" class="t muted">loaded at session start</text>
  <text x="672" y="82" text-anchor="end" class="s" fill="var(--good)" font-weight="700">flat · every session</text>
  <text x="48" y="110" class="h ink">~2K tokens</text>
  <rect x="180" y="100" width="480" height="14" rx="7" fill="var(--card)"/>
  <rect x="180" y="100" width="115" height="14" rx="7" fill="var(--good)"/>

  <!-- always-on group: never moves -->
  <rect x="32" y="144" width="250" height="216" rx="12" fill="var(--card)" stroke="var(--line)"/>
  <text x="50" y="168" class="lbl muted">Always-on · flat</text>
  <rect x="88" y="292" width="28" height="44" rx="4" fill="var(--flatbar)"/>
  <text x="102" y="352" class="tiny muted" text-anchor="middle">CLAUDE.md core</text>
  <rect x="198" y="302" width="28" height="34" rx="4" fill="var(--flatbar)"/>
  <text x="212" y="352" class="tiny muted" text-anchor="middle">project CLAUDE.md</text>

  <!-- on-demand group: grows between moments — BACKLOG.md shrinks once, at session 30, as tickets close -->
  <rect x="302" y="144" width="386" height="216" rx="12" fill="var(--card)" stroke="var(--accent)"/>
  <text x="320" y="168" class="lbl" fill="var(--accent)">On-demand · grows</text>
  <text x="355" y="352" class="tiny ink" text-anchor="middle">FRAMEWORK.md</text>
  <text x="495" y="352" class="tiny ink" text-anchor="middle">BACKLOG.md</text>
  <text x="635" y="352" class="tiny ink" text-anchor="middle">LEARNINGS.md</text>

  <!-- timeline base: three moments, muted until their turn -->
  <line x1="120" y1="392" x2="630" y2="392" stroke="var(--line)"/>
  <circle cx="120" cy="392" r="5" fill="var(--muted)"/>
  <text x="120" y="412" class="mono muted" text-anchor="middle">session 1</text>
  <circle cx="375" cy="392" r="5" fill="var(--muted)"/>
  <text x="375" y="412" class="mono muted" text-anchor="middle">session 10</text>
  <circle cx="630" cy="392" r="5" fill="var(--muted)"/>
  <text x="630" y="412" class="mono muted" text-anchor="middle">session 30</text>

  <!-- moment 1: session 1 -->
  <g id="od1">
    <rect x="338" y="312" width="34" height="24" rx="4" fill="var(--accent)"/>
    <rect x="478" y="298" width="34" height="38" rx="4" fill="var(--accent)"/>
    <rect x="618" y="318" width="34" height="18" rx="4" fill="var(--accent)"/>
    <circle cx="120" cy="392" r="6" fill="var(--accent)"/>
    <text x="120" y="412" class="mono ink" font-weight="700" text-anchor="middle">session 1</text>
  </g>

  <!-- moment 2: session 10 -->
  <g id="od2">
    <rect x="338" y="258" width="34" height="78" rx="4" fill="var(--accent)"/>
    <rect x="478" y="252" width="34" height="84" rx="4" fill="var(--accent)"/>
    <rect x="618" y="262" width="34" height="74" rx="4" fill="var(--accent)"/>
    <circle cx="375" cy="392" r="6" fill="var(--accent)"/>
    <text x="375" y="412" class="mono ink" font-weight="700" text-anchor="middle">session 10</text>
  </g>

  <!-- moment 3: session 30 — BACKLOG.md is shorter than at session 10: tickets closed -->
  <g id="od3">
    <rect x="338" y="232" width="34" height="104" rx="4" fill="var(--accent)"/>
    <rect x="478" y="272" width="34" height="64" rx="4" fill="var(--accent)"/>
    <text x="495" y="264" class="tiny muted" text-anchor="middle">↓ closed</text>
    <rect x="618" y="204" width="34" height="132" rx="4" fill="var(--accent)"/>
    <circle cx="630" cy="392" r="6" fill="var(--accent)"/>
    <text x="630" y="412" class="mono ink" font-weight="700" text-anchor="middle">session 30</text>
  </g>

  <text x="360" y="436" text-anchor="middle" class="s muted">On-demand files grow — and occasionally shrink as tickets close —</text>
  <text x="360" y="452" text-anchor="middle" class="s muted">the always-on core and the gauge above never move.</text>
</svg>
