name: CI

on:
  push:
    branches: [main]
  pull_request:
  # dir #744 (B25): the merge queue's event. Every required job runs on it as on pull_request; inert until the
  # queue is enabled in branch protection (the operator's step), since no such event fires before that.
  merge_group:

permissions:
  contents: read

# dir #744 (B9): every job sets timeout-minutes = max(2 x the leg's p90, p90 + 10 min), rounded up to 5 min,
# so a hung job is killed at a bound sized to its leg instead of GitHub's 360-minute default. Pinned per job
# by tests/test_ci_workflow.sh. tests/run.sh's per-file watchdog (600 s under CI) fires first for a hung
# test file and prints its log; this bound catches a hang outside any test file.
jobs:
  # Images pinned to explicit versions (not the drifting -latest aliases) for reproducible runs.
  tests:
    name: tests (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: bash version
        run: bash --version | head -1
      - name: Run test suite
        run: bash tests/run.sh

  # dir #744 (B16): macOS is the long pole (one unsharded leg ran 12-16 min), so it runs as two shards — each
  # takes tests/run.sh's KEEL_TEST_SHARD=K/2 share (size-greedy by file bytes, every file exactly once) — and
  # an aggregator below reports the one required check name, `tests (macos-14)`. No branch-protection change.
  macos-shards:
    name: tests (macos-14, shard ${{ matrix.shard }}/2)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: bash version
        run: bash --version | head -1
      - name: Run test suite (one shard)
        env:
          KEEL_TEST_SHARD: ${{ matrix.shard }}/2
        run: bash tests/run.sh

  # The required `tests (macos-14)` check: green only when BOTH shards succeeded. `if: always()` so a failed,
  # cancelled or skipped shard still yields a red check here rather than a skipped one (branch protection
  # treats a skipped required check as passing). On ubuntu: it must not take one of the account's macOS slots.
  macos:
    name: tests (macos-14)
    needs: macos-shards
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Require both macOS shards to succeed
        env:
          SHARDS_RESULT: ${{ needs.macos-shards.result }}
        run: |
          if [ "$SHARDS_RESULT" != success ]; then
            echo "macOS shards: $SHARDS_RESULT (both must succeed)" >&2
            exit 1
          fi
          echo "macOS shards: success"

  alpine:
    name: tests (alpine-busybox)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # Run the suite under Alpine's busybox coreutils — the durable guard against GNU-only constructs.
      # A busybox `grep --include` gap shipped uncaught precisely because the matrix was GNU + BSD only.
      # `-e CI` forwards the runner's own CI=true into the container (docker passes through the
      # host's value when given a bare var name) so tests/run.sh's own CI-aware default (dir #154)
      # applies here too — dir #153 first found this job's nproc-based default (container-reported,
      # not container-limited) contending hard enough under real load to flake an unrelated
      # timing-sensitive check; dir #154 traced the same flake to a plain ubuntu-24.04 leg and moved
      # the fix into tests/run.sh's own default so every CI leg gets it for free, this one included.
      # `jq` (dir #220): without it, tests/test_pre_pr_gate.sh and its install-side siblings skip
      # cleanly rather than running — so "alpine-busybox: success" was silently NOT evidence about
      # tools/pre-pr-gate.sh, the largest shell surface in the repo, on its one non-GNU CI leg.
      # `git config --system --add safe.directory '*'` (dir #191): this leg bind-mounts the WHOLE
      # checkout into the container, so EVERY git call any script makes inside is dubious-owned to a
      # container-root reader, not just a test's own clone (the narrower class the "Alpine-only trap"
      # in this repo's CLAUDE.md already names). `--system`, not `--global` (found live, an independent
      # `/code-review` altitude-angle pass): `tests/lib.sh` sandboxes every test file's `HOME` and
      # `GIT_CONFIG_GLOBAL` to a fresh per-run path before its own body executes (dir #64), which
      # shadows the "global" config scope outright — a `--global` write made here, before that
      # override, becomes invisible to any git call any test file makes afterward (reproduced live:
      # `git config --global --get-all safe.directory` returns nothing once `GIT_CONFIG_GLOBAL` is
      # redirected, while `--system`'s value still resolves). System scope is a separate file
      # (`/etc/gitconfig`) that no test's `HOME`/`GIT_CONFIG_GLOBAL` override touches, so it is the
      # only scope that actually reaches every git call in the suite — closing the class for every git
      # call, present and future, rather than requiring each new script to carry its own `|| true` guard.
      - name: Run test suite on Alpine/busybox
        run: |
          docker run --rm -e CI -v "$PWD:/keel" -w /keel alpine:3.21 \
            sh -c 'apk add --no-cache bash git jq >/dev/null && git config --system --add safe.directory "*" && bash tests/run.sh'

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Pinned like actions/checkout above (S7, backlog dir #4) — the runner image's preinstalled
      # shellcheck floats with whatever that image ships, so results could drift silently between
      # runs even though nothing in this repo changed.
      SHELLCHECK_VERSION: v0.11.0
      SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned ShellCheck
        run: |
          asset="shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/${asset}" -o "/tmp/$asset"
          echo "${SHELLCHECK_SHA256}  /tmp/$asset" | sha256sum -c -
          tar -xJf "/tmp/$asset" -C /tmp
          sudo mv "/tmp/shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
      - name: ShellCheck
        run: |
          shellcheck --version
          # One canonical file-selection source (tools/self/shellcheck-targets.sh) shared with
          # tools/self/doctor.sh, so this list can't drift into two hand-maintained copies.
          files="$(tools/self/shellcheck-targets.sh)"
          # shellcheck disable=SC2086  # intentional word-split of the newline list (no spaces in tracked paths)
          # --severity=warning: fail on warning/error, not on info/style (e.g. SC2015), which vary by
          # shellcheck version and would make the gate flaky across runners.
          shellcheck -x --severity=warning $files

  secret-scan:
    name: secret-scan (server-side floor, SEC4)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Full commit history, not the default shallow clone: --range walks ancestry between two
          # shas (PR base/head, or push before/after), which a depth-1 checkout wouldn't have locally.
          # filter=blob:none keeps that history request cheap — full commit/tree topology up front,
          # but blob content is fetched lazily, only for the objects the range scan actually reads.
          fetch-depth: 0
          filter: blob:none
      - name: secret-scan --range (introduced blobs, commit messages, tag bodies)
        # dir #572: on a force-push whose "before" sha is orphaned AND unfetchable, ci-scan.sh falls
        # back to a full-history scan in which no .secret-scan-allow entry can exempt anything (it has
        # no baseline to prove the entry predates the secret). That blocks, never passes. An operator
        # who needs a legitimate entry to keep exempting adds
        # `SECRET_SCAN_CI_FORCE_PUSH_BASELINE: <trusted pre-force-push rev>` to this env block
        # deliberately — see ci-scan.sh's header. It is not set here: unset is the safe default.
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          # dir #744 (B26): on merge_group the base is the group's parent commit (the payload's
          # merge_group.base_sha — a required field of GitHub's merge_group schema) and the head is the
          # group's own sha (github.sha); on pull_request, the PR's base/head as before.
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          GITHUB_HEAD_SHA: ${{ github.event_name == 'merge_group' && github.sha || github.event.pull_request.head.sha }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_EVENT_AFTER: ${{ github.event.after }}
        run: tools/secret-guard/ci-scan.sh

  self-check:
    name: keel self-check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Full history + tags, not the default shallow/no-tags clone (dir #139): self/doctor.sh's
          # CHANGELOG<->git-tag reconciliation needs every `v*` tag to actually be present locally, or
          # it can't tell "a release tag is missing its CHANGELOG section" from "this clone just
          # doesn't have the tags" — it degrades to a silent skip on a shallow checkout rather than
          # false-GAPing, so without this the check would never actually run in CI.
          fetch-depth: 0
          # NOT paired with filter: blob:none like the secret-scan job above (dir #213): that pairing's
          # rationale — "the check only reads tag NAMES and CHANGELOG.md's working-tree text, never blob
          # content across history" — stopped being true when dir #156 landed `_pending_release_intro_commit`,
          # a `git log -S` pickaxe that DOES need CHANGELOG.md's blob at every commit it walks. Under a
          # blobless partial clone that either lazily fetches (silent extra network per run) or, with the
          # promisor unreachable, fails outright — which this job needs full blob content to avoid.
      # tools/self/doctor.sh audits keel's OWN repo health (ship-skip-list sync, dead internal
      # references, tool wiring/test-coverage, CHANGELOG staleness, CHANGELOG<->tag reconciliation) —
      # distinct from the `tests` and `shellcheck` jobs above, though it also orchestrates (re-runs)
      # those same checks into one report, so a regression in the self-audit tool itself is caught
      # here even if the underlying checks it wraps still pass individually.
      - name: keel self-check
        run: bash tools/self/doctor.sh
